name: Daily Hyperliquid Note

on:
  schedule:
    # 07:30 JST = 22:30 UTC (前日)
    - cron: "30 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Run Claude Code (fetch price + curate news + save draft)
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: >-
            --allowedTools "Bash,WebSearch,Write"
            --permission-mode bypassPermissions
            --model claude-sonnet-4-6
          prompt: |
            あなたは「今日のHyperliquid」というnote記事を毎日自動生成するエージェントです。
            以下の手順を順番に実行してください。エラーが出ても途中で止めず、
            可能な範囲で処理を続け、最後に何が失敗したかを明確に報告してください。

            手順1: HYPE価格データの取得
            Bashツールで次のコマンドを実行し、Hyperliquid公式APIから価格を取得してください。
            curl -s -X POST https://api.hyperliquid.xyz/info -H "Content-Type: application/json" -d "{\"type\":\"metaAndAssetCtxs\"}"
            レスポンスは meta と assetCtxs の配列です。meta.universe の中から name が HYPE である要素のインデックスを探し、assetCtxs の同じインデックスにある markPx（現在値）と prevDayPx（24時間前の値）を取得してください。前日比(%)を計算してください。jqが使えるので jq で抽出すると確実です。

            手順2: 今日のHyperliquid関連ニュースを収集
            WebSearchツールで、直近24時間以内のHyperliquid関連ニュース(英語・日本語どちらも)を検索してください。目安として3〜5件、プロダクトアップデート・大口動向・エコシステム系ニュース・相場に影響しそうな出来事を優先して拾ってください。出典が曖昧なもの、真偽不明な噂は採用しないでください。

            手順3: note記事の執筆と保存
            以下の構成でMarkdown形式の記事を書いてください。
            タイトル: 「今日のHyperliquid」+ 日付(YYYY年M月D日)
            冒頭: HYPEの現在価格と前日比(%)を明記(上昇は上矢印、下落は下矢印などで視覚的に)
            本文: 手順2で集めたニュースを2〜4行程度で要約しながら箇条書きで紹介。各ニュースの出典(メディア名)も明記
            末尾: 「本記事は情報提供を目的としており、投資助言ではありません」の一文を必ず入れる
            文字数の目安: 800〜1200字程度
            事実に基づかない推測や誇張した価格予想は書かない

            この記事を drafts/YYYY-MM-DD-hyperliquid.md というファイル名で保存してください(YYYY-MM-DDは今日の日付)。drafts フォルダがなければ作成してください。
            保存後、以下のコマンドでこのファイルだけをリポジトリにコミット・プッシュしてください。
            git add drafts/
            git commit -m "Add daily Hyperliquid note draft for YYYY-MM-DD"
            git push

            手順4: 結果報告
            最後に、以下を簡潔にまとめて出力してください。
            HYPEの価格と前日比
            採用したニュースの見出し一覧
            保存したファイルのパス
            コミット・プッシュが成功したか
