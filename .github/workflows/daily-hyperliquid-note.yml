name: Daily Hyperliquid Note

on:
  schedule:
    # 07:30 JST = 22:30 UTC (前日)
    - cron: "30 22 * * *"
  workflow_dispatch: {}
    # Actionsタブから手動実行するとテストできます

permissions:
  contents: read
  id-token: write

jobs:
  generate-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clone & build note-com-mcp
        run: |
          git clone https://github.com/shimayuz/note-com-mcp.git mcp/note-com-mcp
          cd mcp/note-com-mcp
          npm install
          npx playwright install --with-deps chromium
          npm run build

      - name: Debug note-com-mcp build output
        run: |
          echo "--- package.json ---"
          cat mcp/note-com-mcp/package.json
          echo "--- dist directory ---"
          ls -la mcp/note-com-mcp/dist || echo "no dist directory found"
          echo "--- Manual start attempt (8s timeout) ---"
          cd mcp/note-com-mcp
          NOTE_EMAIL="${{ secrets.NOTE_EMAIL }}" NOTE_PASSWORD="${{ secrets.NOTE_PASSWORD }}" timeout 8 node dist/index.js 2>&1 || true

       - name: Run Claude Code (fetch price + curate news + post draft to note)
        uses: anthropics/claude-code-action@v1
        env:
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          show_full_output: true
          claude_args: >-
            --mcp-config .mcp.json
            --allowedTools "Bash,WebSearch,mcp__note-com"
            --permission-mode bypassPermissions
            --model claude-sonnet-4-6
          prompt: |
            あなたは「今日のHyperliquid」というnote記事を毎日自動生成・下書き投稿するエージェントです。
            以下の手順を順番に実行してください。エラーが出た場合は途中で止めず、
            可能な範囲で処理を続け、最後に何が失敗したかを明確に報告してください。

            ## 手順1: HYPE価格データの取得
            Bashツールでcurlを使い、Hyperliquid公式APIから価格を取得してください。
